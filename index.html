<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restaurante - Gestión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🍽️ Restaurante</h1>
        <p>API: http://localhost:5000</p>

        <div class="tabs">
            <button class="tab-btn active" onclick="mostrarTab('crud')">Pedidos</button>
            <button class="tab-btn" onclick="mostrarTab('reportes')">Reportes</button>
            <button class="tab-btn" onclick="mostrarTab('jsonb')">JSONB</button>
        </div>

        <!-- CRUD -->
        <div id="tab-crud" class="tab-content active">
            <div class="grid-2">
                <div class="card">
                    <h3>Crear Pedido</h3>
                    <label>Cliente:</label><input type="number" id="cr_cliente" value="1">
                    <label>Empleado:</label><input type="number" id="cr_empleado" value="2">
                    <label>Mesa:</label><input type="number" id="cr_mesa" value="3">
                    <label>Producto:</label><input type="number" id="cr_producto" value="10">
                    <label>Cantidad:</label><input type="number" id="cr_cantidad" value="2">
                    <button onclick="crearPedido()">Crear</button>
                    <div id="resultado-crear" class="resultado">Listo</div>
                </div>
                <div class="card">
                    <h3>Listar Pedidos</h3>
                    <button onclick="listarPedidos()">Ver todos</button>
                    <div id="resultado-listar" class="resultado">Listo</div>
                </div>
                <div class="card">
                    <h3>Editar Pedido</h3>
                    <label>ID:</label><input type="number" id="ed_id" value="1">
                    <label>Estado:</label>
                    <select id="ed_estado">
                        <option>Pendiente</option>
                        <option>En preparación</option>
                        <option>Entregado</option>
                        <option>Cancelado</option>
                    </select>
                    <label>Total:</label><input type="number" id="ed_total" value="50">
                    <button onclick="editarPedido()">Actualizar</button>
                    <div id="resultado-editar" class="resultado">Listo</div>
                </div>
                <div class="card">
                    <h3>Eliminar Pedido</h3>
                    <label>ID:</label><input type="number" id="del_id" value="1">
                    <button onclick="eliminarPedido()">Eliminar</button>
                    <div id="resultado-eliminar" class="resultado">Listo</div>
                </div>
            </div>
        </div>

        <!-- REPORTES -->
        <div id="tab-reportes" class="tab-content">
            <div class="grid-2">
                <div class="card">
                    <h3>Ventas por Cliente</h3>
                    <button onclick="reporteVentas()">Ver Reporte</button>
                    <button onclick="exportarCSV()">Exportar CSV</button>
                    <div id="resultado-reporte" class="resultado">Listo</div>
                </div>
                <div class="card">
                    <h3>Productos por Categoría</h3>
                    <button onclick="reporteProductos()">Ver Reporte</button>
                    <button onclick="exportarProductosCSV()">Exportar CSV</button>
                    <div id="resultado-reporte-productos" class="resultado">Listo</div>
                </div>
            </div>
        </div>

        <!-- JSONB -->
        <div id="tab-jsonb" class="tab-content">
            <div class="grid-2">
                <div class="card">
                    <h3>Guardar JSONB</h3>
                    <textarea id="jsonb_datos">{"cliente":{"nombre":"Luis"},"productos":[{"nombre":"Ceviche","cantidad":1}],"total":25}</textarea>
                    <button onclick="guardarJSONB()">Guardar</button>
                    <div id="resultado-jsonb-guardar" class="resultado">Listo</div>
                </div>
                <div class="card">
                    <h3>Consultar JSONB</h3>
                    <input type="text" id="jsonb_nombre" placeholder="Nombre del cliente" value="Luis">
                    <button onclick="consultarJSONB()">Buscar</button>
                    <div id="resultado-jsonb-consultar" class="resultado">Listo</div>
                </div>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
